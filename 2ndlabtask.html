<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Registration</title>
</head>
<body>
    <h1>Registration</h1>
    
    <table border="0">
        <theady>
            <tr>
                <th>
    <fieldset>
        <legend><b>General Information</b></legend>
	<form method="POST">
        <table border="0">
            <thead>
                <tr>
                    <th></th>
                    <th></th>
                    <th></th>
                    <th></th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>
		<label for="firstname"><b>First Name</b></label>
                    </td>
                    <td>
		<label for="colon"><b>:</b></label>
                    </td>
                    <td>
		<input type="text" name="firstname" id="fname">	
                    </td> 
                </tr>   
		<!-- <br>
        <br> -->
                <tr>
                    <td>
        <label for="lastname"><b>Last Name</b></label>
                    </td>
                    <td>
		<label for="colon"><b>:</b></label>
                    </td>
                    <td>
		<input type="text" name="lastname" id="lname">
                    </td>
                </tr>
    
		<!-- <br>
        <br> -->
                <tr>
                    <td>
        <p><b>Gender</b></p>
                    </td>
                    <td>
            <label for="colon"><b>:</b></label>
                    </td>
                    <td>
        <input type="radio" name="gender" id="male" value="male">	
		<label for="male">Male</label>
		<input type="radio" name="gender" id="female" value="female">	
		<label for="female">Female</label>
                    </td>
                </tr>
		<!-- <br>
        <br> -->

                <tr>
                    <td>
        <label for="fathername"><b>Father's Name</b></label>
                    </td>
                    <td>
                        <label for="colon"><b>:</b></label>
                    </td>
                    <td>
		<input type="text" name="fathername" id="fname">
                    </td>
                    <td>	
		<input type="file" name="fatherfile" id="fatherfile">
                    </td>
                </tr>   
        <!-- <br>
        <br> -->
                <tr>
                    <td>
        <label for="mothername"><b>Mother's Name</b></label>
                    </td>
                    <td>
                        <label for="colon"><b>:</b></label>
                    </td>
                    <td>
		<input type="text" name="mothername" id="mname">
                    </td>
                    </tr>	
        <!-- <br>
        <br> -->
                <tr>
                    <td>
        <label for ="Bloodgroup"><b>Blood Group</b></label>
                    </td>
                    <td>
                        <label for="colon"><b>:</b></label>
                    </td>
                    <td>
        <select name="bloodgroup" id="bloodgroup">
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
        </select>
                    </td>
                </tr>
        <!-- <br>    
        <br> -->
                <tr>
                    <td>
        <label for ="Religion"><b>Religion</b></label>
                    </td>
                    <td>
                        <label for="colon"><b>:</b></label>
                    </td>
                    <td>        
        <select name="religion" id="religion">
            <option value="islam">Islam</option>
            <option value="hinduism">Hinduism</option>
            <option value="christianity">Christianity</option>
            <option value="buddhism">Buddhism</option>
        </select>
        </td>
                    </tr>
        <!-- <br>    
        <br> -->
        </tbody>
        </table>
        </fieldset>
        </th>


        <th>
        <fieldset>
            <legend><b>Contact Information</b></legend>
        
            <table border="0">
                <thead>
                    <tr>
                        <th></th>
                        <th></th>
                        <th></th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>
        <label for="email"><b>Email</b></label>
                        </td>
                        <td>
                            <label for="colon"><b>:</b></label>
                        </td>
                        <td>
        <input type="email" name="email" id="email">
                        </td>
                    </tr>
        <!-- <br>
        <br> -->

                    <tr>
                        <td>
        <label for="phone"><b>Phone/Mobile</b></label>
                        </td>
                        <td>
                            <label for="colon"><b>:</b></label>
                        </td>
                        <td>
        <input type="tel" name="phone" id="phone">
                        </td>
                    </tr>
    
        <!-- <br>
        <br> -->
                    <tr>
                        <td>
        <label for="Website"><b>Website</b></label>
                        </td>
                        <td>
                            <label for="colon"><b>:</b></label>
                        </td>
                        <td>
        <input type="url" name="Website" id="Website">
                        </td>
                    </tr>
<!--                 
        <br>
        <br> -->
                    <tr>
                        <td>
        <label for="address"><b>Address</b></label>
                        </td>
                        <td>
                            <label for="colon"><b>:</b></label>
                        </td>
                        <td>
                            <fieldset>
                                <legend><b>Present Address</b></legend>

        <select name="Caddress" id="Caddress">
            <option value="Bangladesh">Bangladesh</option>
            <option value="India">India</option>
            <option value="Nepal">Nepal</option>
        </select>    

        <select name="Daddress" id="Daddress">
            <option value="Dhaka">Dhaka</option>
            <option value="Chittagong">Chittagong</option>
            <option value="Khulna">Khulna</option>
            <option value="Rajshahi">Rajshahi</option>
            <option value="Barisal">Barisal</option>
            <option value="Sylhet">Sylhet</option>
            <option value="Rangpur">Rangpur</option>
        </select>

        <br>
        <!-- <label for="laddress"><b>Address :</b></label> -->
        <textarea name="address" placeholder="Road/Street/City" id="address" cols="30" rows="5"></textarea>
        <br>
        <!-- <label for="postal"><b>Postal Code :</b></label> -->
        <input type="text" name="postal" placeholder="Post Code" id="postal">
        <!-- <br>
        <br> -->
                            </fieldset>
                        </td>
                    </tr>
                </tbody>
            </table>
        </fieldset>
        </th>

        <td>
        <fieldset>
            <legend><b>Account Information</b></legend>
            <table border="0">
                <thead>
                    <tr>
                        <th></th>
                        <th></th>
                        <th></th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>
        <label for="username"><b>Username</b></label>
                        </td>
                        <td>
                            <label for="colon"><b>:</b></label>
                        </td>
                        <td>   
        <input type="text" name="username" id="username">
                        </td>
                    </tr>
        <!-- <br>
        <br> -->
        <tr>
                    <td>
		<label for="password"><b>Password</b></label>
                    </td>
                    <td>
                        <label for="colon"><b>:</b></label>
                    </td>
                    <td>    
		<input type="password" name="password" id="password">
                    </td>
                    </tr> 
<!--                     	
		<br>
        <br> -->

                    <tr>
                        <td>
		<label for="Cpassword"><b>Confirm Password</b></label>
                        </td>
                        <td>
                            <label for="colon"><b>:</b></label>
                        </td>
                        <td>
		<input type="password" name="Cpassword" id="Cpassword">	
                        </td>
                    </tr>
		<!-- <br>
        <br> -->
                </tbody>
            </table>
        </fieldset>
        <input type="submit" name="submit" value="Register">
    
        </th>
            </tr>
        
    </form>
</thead>
</body>
</html>
